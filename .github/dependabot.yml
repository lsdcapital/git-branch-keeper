version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new releases age a few days before proposing them; security updates ignore this.
    cooldown:
      default-days: 5
    groups:
      python-deps:
        patterns: ["*"]

  # GitHub Actions versions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
