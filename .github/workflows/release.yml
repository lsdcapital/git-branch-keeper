name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Enables manual trigger from GitHub UI
    inputs:
      version_tag:
        description: 'Version tag to release (e.g., v0.1.0). Leave empty to use current HEAD.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishers

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release  # Links to GitHub environment for protection rules

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ inputs.version_tag || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2

    - name: Build package
      run: |
        uv build

    - name: Verify package
      run: |
        uv run --locked twine check dist/*

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Opt-in: requires a PyPI Trusted Publisher for this repo/workflow/environment.
    # Enable by setting the repository variable PUBLISH_TO_PYPI=true.
    - name: Publish to PyPI
      if: vars.PUBLISH_TO_PYPI == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1

