[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "git-branch-keeper"
dynamic = ["version"]
description = "A smart Git branch management tool that helps keep your repository clean and organized"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["git", "branch", "management", "cleanup"]
authors = [
    { name = "Stefan Lesicnik", email = "stefan@lsdcapital.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "gitpython>=3.2.1",
    "rich>=15.0.0",
    "pygithub>=2.10.0",
    "textual>=8.2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=git_branch_keeper",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
# Type-check the bodies of unannotated functions too.
check_untyped_defs = true

[[tool.mypy.overrides]]
# Tests stay loosely typed: mocks and monkeypatching trip the stricter check without
# catching real bugs, so skip unannotated bodies there and silence the resulting note.
module = ["tests.*", "conftest"]
check_untyped_defs = false
disable_error_code = ["annotation-unchecked"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.2",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/lsdcapital/git-branch-keeper"
Repository = "https://github.com/lsdcapital/git-branch-keeper.git"
"Bug Tracker" = "https://github.com/lsdcapital/git-branch-keeper/issues"
Changelog = "https://github.com/lsdcapital/git-branch-keeper/blob/main/CHANGELOG.md"
"Contributing" = "https://github.com/lsdcapital/git-branch-keeper/blob/main/CONTRIBUTING.md"

[project.scripts]
git-branch-keeper = "git_branch_keeper.cli.main:main"
gbk = "git_branch_keeper.cli.main:main"
git-gbk = "git_branch_keeper.cli.main:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "git_branch_keeper/_version.py"
